[workspace]
members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/adbc-drivers/sedonadb"

[package]
name = "adbc-driver-sedonadb"
description = "ADBC driver for Apache SedonaDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adbc_core = ">=0.24.0"
adbc_ffi = { version = ">=0.24.0", optional = true }
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
datafusion = { version = "54.1.0", default-features = false }
driverbase = { git = "https://github.com/adbc-drivers/driverbase-rs.git", rev = "e452a3728c430110a01d05d1f417e74c83ecf2a8" }
futures = "0.3"
flate2 = { version = "1", optional = true }
sedona = { git = "https://github.com/apache/sedona-db.git", rev = "0348a8fd7ee8ab23d25f86bbbf2d89d91c5b18ae", features = ["proj", "s2geography"] }
sedona-catalog = { git = "https://github.com/apache/sedona-db.git", rev = "0348a8fd7ee8ab23d25f86bbbf2d89d91c5b18ae" }
sedona-extension = { git = "https://github.com/apache/sedona-db.git", rev = "0348a8fd7ee8ab23d25f86bbbf2d89d91c5b18ae" }
sedona-proj = { git = "https://github.com/apache/sedona-db.git", rev = "0348a8fd7ee8ab23d25f86bbbf2d89d91c5b18ae", default-features = false }
tar = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7"

[dev-dependencies]
async-trait = "0.1"

[features]
default = ["ffi"]
bundled-proj-data = ["dep:flate2", "dep:tar", "dep:tempfile"]
ffi = ["dep:adbc_ffi"]

[lib]
crate-type = ["lib", "cdylib"]

[lints.rust]
linker_messages = "allow"
